<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pendaftaran Berhasil - UAKI UB</title>
    <link rel="icon" href="/assets-hero/logoUAKI.svg" type="image/svg+xml">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800;900&display=swap">

    <link rel="stylesheet" href="../css/theme.css">
    <link rel="stylesheet" href="../components/components.css">
    <link rel="stylesheet" href="status.css">
</head>
<body class="page-success d-flex flex-column min-vh-100">

    <div id="uakiNavbar"></div>

    <main class="status-wrapper">
        <div class="status-decor" aria-hidden="true">
            <img src="/assets-recruitment/dot.svg" class="decor-dot" alt="">
            <img src="/assets-recruitment/small-blob.svg" class="decor-blob-1" alt="">
            <img src="/assets-recruitment/star.svg" class="decor-star-1" alt="">
            <img src="/assets-recruitment/circle.svg" class="decor-circle" alt="">
            <img src="/assets-recruitment/daun-crop.svg" class="decor-leaf-left" alt="">
            <img src="/assets-recruitment/small-blob.svg" class="decor-blob-2" alt="">
            <img src="/assets-recruitment/star.svg" class="decor-star-2" alt="">
            <img src="/assets-recruitment/big-blob.svg" class="decor-blob-3" alt="">
            <img src="/assets-recruitment/daun-crop.svg" class="decor-leaf-right" alt="">
        </div>

        <div class="status-card">
            <img src="/assets-recruitment/icon-check.svg" class="status-icon-check" alt="Berhasil">

            <h1 class="status-title">Pendaftaran Berhasil!</h1>
            <p class="status-subtitle">Selamat, kamu telah terdaftar sebagai calon Staff Muda UAKI 2026</p>

            <div class="status-wa-box">
                <img src="/assets-recruitment/icon-whatsapp.svg" class="status-wa-icon" alt="">
                <div>
                    <div class="status-wa-judul">Gabung Grup WhatsApp Staff Muda 2026</div>
                    <div class="status-wa-desc">Bergabunglah dengan grup WhatsApp untuk mendapatkan informasi terbaru dan pengumuman penting</div>
                    <a href="#" target="_blank" class="btn-status-primary" id="tombolGabungWa">
                        Gabung Sekarang <img src="/assets-recruitment/icon-external.svg" class="btn-icon-inline" alt="">
                    </a>
                </div>
            </div>

            <div class="status-lanjut-wrap">
                <button type="button" class="btn-status-primary" id="tombolLanjutSuccess">
                    Lanjutkan <img src="/assets-recruitment/icon-arrow-right.svg" class="btn-icon-inline" alt="">
                </button>
            </div>
        </div>
    </main>

    <div id="uakiFooter"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../components/components.js"></script>
    <script src="status.js"></script>
</body>
</html>
