<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kata Sandi Baru - UAKI UB</title>
    <link rel="icon" href="/assets-hero/logoUAKI.svg" type="image/svg+xml">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800;900&display=swap">

    <link rel="stylesheet" href="../css/theme.css">
    <link rel="stylesheet" href="../components/components.css">
    <link rel="stylesheet" href="auth.css">
</head>
<body class="page-reset-password d-flex flex-column min-vh-100">

    <div id="uakiNavbar"></div>

    <main class="auth-wrapper">
        <div class="auth-decor" aria-hidden="true">
            <img src="/assets-auth/dot.svg" class="decor decor-dots" alt="">
            <img src="/assets-auth/vector-blob.svg" class="decor decor-blob-1" alt="">
            <img src="/assets-auth/vector-blob.svg" class="decor decor-blob-2" alt="">
            <img src="/assets-auth/circle.svg" class="decor decor-circle" alt="">
            <img src="/assets-auth/daun-crop.svg" class="decor decor-leaf-left" alt="">
            <img src="/assets-auth/daun-crop.svg" class="decor decor-leaf-right" alt="">
            <img src="/assets-auth/star.svg" class="decor decor-star-1" alt="">
            <img src="/assets-auth/star.svg" class="decor decor-star-2" alt="">
            <img src="/assets-auth/star.svg" class="decor decor-star-3" alt="">
            <img src="/assets-auth/star.svg" class="decor decor-star-4" alt="">
        </div>

        <div class="auth-card">

            <div class="auth-logo">
                <img src="/assets-hero/logoUAKI.svg" alt="Logo UAKI UB">
            </div>

            <h1 class="auth-title">Kata Sandi Baru</h1>
            <p class="auth-subtitle">Masukkan kata sandi baru untuk akun Anda.</p>

            <!-- Reserved buat notice token invalid/kadaluarsa dari backend, bagian ini belum ada logic JS-nya -->
            <div class="auth-notice" id="noticeGagal"></div>

            <form id="formSandiBaru" novalidate>
                <div class="mb-3">
                    <label class="auth-label" for="sandiBaru">Kata Sandi Baru</label>
                    <div class="input-group password-group">
                        <span class="input-group-text"><img src="/assets-auth/icon-lock.svg" alt="Kata Sandi"></span>
                        <input type="password" class="form-control" id="sandiBaru" placeholder="Buat Kata Sandi Anda">
                        <span class="input-group-text toggle-password" data-target="sandiBaru"><img src="/assets-auth/icon-eye.svg" alt="Lihat kata sandi"></span>
                    </div>
                    <div class="form-error">Kata sandi baru wajib diisi.</div>
                </div>

                <div class="mb-3">
                    <label class="auth-label" for="konfirmasiSandiBaru">Konfirmasi Kata Sandi Baru</label>
                    <div class="input-group password-group">
                        <span class="input-group-text"><img src="/assets-auth/icon-lock.svg" alt="Kata Sandi"></span>
                        <input type="password" class="form-control" id="konfirmasiSandiBaru" placeholder="Konfirmasi kata sandi baru Anda">
                        <span class="input-group-text toggle-password" data-target="konfirmasiSandiBaru"><img src="/assets-auth/icon-eye.svg" alt="Lihat kata sandi"></span>
                    </div>
                    <div class="form-error" id="errorKonfirmasiSandiBaru">Konfirmasi kata sandi wajib diisi.</div>
                </div>

                <p class="form-hint mb-3">Minimal 8 karakter dengan kombinasi huruf, angka, dan simbol.</p>

                <button type="submit" class="btn btn-uaki-primary" id="tombolSimpanSandi">Simpan Kata Sandi</button>
            </form>
        </div>
    </main>

    <div id="uakiFooter"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../components/components.js"></script>
    <script src="auth.js"></script>
</body>
</html>
