<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lupa Kata Sandi - UAKI UB</title>
    <link rel="icon" href="/assets-hero/logoUAKI.svg" type="image/svg+xml">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800;900&display=swap">

    <link rel="stylesheet" href="../css/theme.css">
    <link rel="stylesheet" href="../components/components.css">
    <link rel="stylesheet" href="auth.css">
</head>
<body class="page-forgot-password d-flex flex-column min-vh-100">

    <div id="uakiNavbar"></div>

    <main class="auth-wrapper">
        <div class="auth-decor" aria-hidden="true">
            <img src="/assets-auth/dot.svg" class="decor decor-dots" alt="">
            <img src="/assets-auth/vector-blob.svg" class="decor decor-blob-1" alt="">
            <img src="/assets-auth/vector-blob.svg" class="decor decor-blob-2" alt="">
            <img src="/assets-auth/circle.svg" class="decor decor-circle" alt="">
            <img src="/assets-auth/daun-crop.svg" class="decor decor-leaf-left" alt="">
            <img src="/assets-auth/daun-crop.svg" class="decor decor-leaf-right" alt="">
            <img src="/assets-auth/star.svg" class="decor decor-star-1" alt="">
            <img src="/assets-auth/star.svg" class="decor decor-star-2" alt="">
            <img src="/assets-auth/star.svg" class="decor decor-star-3" alt="">
            <img src="/assets-auth/star.svg" class="decor decor-star-4" alt="">
        </div>

        <div class="auth-card">

            <div class="auth-logo">
                <img src="/assets-hero/logoUAKI.svg" alt="Logo UAKI UB">
            </div>

            <h1 class="auth-title">Lupa Kata Sandi?</h1>
            <p class="auth-subtitle">Masukkan Email anda, untuk mereset kata sandi.</p>

            <div class="auth-notice" id="noticeTerkirim">
                Tautan untuk mengatur ulang kata sandi telah dikirim. Silakan buka email Anda untuk melanjutkan proses.
            </div>

            <form id="formLupaSandi" novalidate>
                <div class="mb-3">
                    <label class="auth-label" for="emailLupaSandi">Email</label>
                    <div class="input-group">
                        <span class="input-group-text"><img src="/assets-auth/icon-email.svg" alt="Email"></span>
                        <input type="email" class="form-control" id="emailLupaSandi" placeholder="Masukkan email Anda">
                    </div>
                    <div class="form-error">Email wajib diisi.</div>
                </div>

                <button type="submit" class="btn btn-uaki-primary mb-3" id="tombolKirimReset">Kirim</button>

                <a href="login.html" class="btn-uaki-outline">
                    <img src="/assets-auth/icon-arrow-left.svg" alt=""> Kembali ke Halaman Login
                </a>
            </form>
        </div>
    </main>

    <div id="uakiFooter"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../components/components.js"></script>
    <script src="auth.js"></script>
</body>
</html>
