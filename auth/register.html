<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Akun - UAKI UB</title>
    <link rel="icon" href="/assets-hero/logoUAKI.svg" type="image/svg+xml">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800;900&display=swap">

    <link rel="stylesheet" href="../css/theme.css">
    <link rel="stylesheet" href="../components/components.css">
    <link rel="stylesheet" href="auth.css">
</head>
<body class="page-register d-flex flex-column min-vh-100">

    <div id="uakiNavbar"></div>

    <main class="auth-wrapper">
        <div class="auth-decor" aria-hidden="true">
            <img src="/assets-auth/dot.svg" class="decor decor-dots" alt="">
            <img src="/assets-auth/vector-blob.svg" class="decor decor-blob-1" alt="">
            <img src="/assets-auth/vector-blob.svg" class="decor decor-blob-2" alt="">
            <img src="/assets-auth/circle.svg" class="decor decor-circle" alt="">
            <img src="/assets-auth/daun-crop.svg" class="decor decor-leaf-left" alt="">
            <img src="/assets-auth/daun-crop.svg" class="decor decor-leaf-right" alt="">
            <img src="/assets-auth/star.svg" class="decor decor-star-1" alt="">
            <img src="/assets-auth/star.svg" class="decor decor-star-2" alt="">
            <img src="/assets-auth/star.svg" class="decor decor-star-3" alt="">
            <img src="/assets-auth/star.svg" class="decor decor-star-4" alt="">
        </div>

        <div class="auth-card">

            <div class="auth-logo">
                <img src="/assets-hero/logoUAKI.svg" alt="Logo UAKI UB">
            </div>

            <h1 class="auth-title">Buat Akun Baru</h1>
            <p class="auth-subtitle">Daftarkan diri Anda untuk bergabung bersama UAKI UB.</p>

            <form id="formRegister" novalidate>
                <div class="mb-3">
                    <label class="auth-label" for="namaRegister">Nama Lengkap</label>
                    <div class="input-group">
                        <span class="input-group-text"><img src="/assets-auth/icon-person.svg" alt="Nama"></span>
                        <input type="text" class="form-control" id="namaRegister" placeholder="Masukkan nama lengkap Anda">
                    </div>
                    <div class="form-error">Nama lengkap wajib diisi.</div>
                </div>

                <div class="mb-3">
                    <label class="auth-label" for="emailRegister">Email</label>
                    <div class="input-group">
                        <span class="input-group-text"><img src="/assets-auth/icon-email.svg" alt="Email"></span>
                        <input type="email" class="form-control" id="emailRegister" placeholder="Masukkan email Anda">
                    </div>
                    <div class="form-error">Email wajib diisi.</div>
                </div>

                <div class="mb-3">
                    <label class="auth-label" for="passwordRegister">Kata Sandi</label>
                    <div class="input-group password-group">
                        <span class="input-group-text"><img src="/assets-auth/icon-lock.svg" alt="Kata Sandi"></span>
                        <input type="password" class="form-control" id="passwordRegister" placeholder="Buat Kata Sandi Anda">
                        <span class="input-group-text toggle-password" data-target="passwordRegister"><img src="/assets-auth/icon-eye.svg" alt="Lihat kata sandi"></span>
                    </div>
                    <div class="form-error">Kata sandi wajib diisi.</div>
                </div>

                <div class="mb-2">
                    <label class="auth-label" for="konfirmasiRegister">Konfirmasi Kata Sandi</label>
                    <div class="input-group password-group">
                        <span class="input-group-text"><img src="/assets-auth/icon-lock.svg" alt="Kata Sandi"></span>
                        <input type="password" class="form-control" id="konfirmasiRegister" placeholder="Ulangi kata sandi Anda">
                        <span class="input-group-text toggle-password" data-target="konfirmasiRegister"><img src="/assets-auth/icon-eye.svg" alt="Lihat kata sandi"></span>
                    </div>
                    <div class="form-error" id="errorKonfirmasi">Kata sandi wajib diisi.</div>
                </div>

                <p class="form-hint mb-3">Minimal 8 karakter dengan kombinasi huruf, angka, dan simbol.</p>

                <button type="submit" class="btn btn-uaki-primary" id="tombolDaftar">Daftar</button>

                <div class="auth-divider">atau</div>

                <button type="button" class="btn-uaki-google">
                    <img src="/assets-auth/icon-google.svg" alt="Google"> Masuk Dengan Google
                </button>

                <p class="auth-footnote">Sudah punya akun? <a href="login.html">Masuk di sini</a></p>
            </form>
        </div>
    </main>

    <div id="uakiFooter"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../components/components.js"></script>
    <script src="auth.js"></script>
</body>
</html>
